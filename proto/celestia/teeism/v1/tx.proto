syntax = "proto3";

package celestia.teeism.v1;

import "celestia/teeism/v1/types.proto";
import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/celestiaorg/celestia-app/x/teeism/types";

// Msg defines the teeism module Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // CreateInterchainSecurityModule defines the rpc method for creating a new TEE ISM.
  rpc CreateInterchainSecurityModule(MsgCreateInterchainSecurityModule)
      returns (MsgCreateInterchainSecurityModuleResponse);

  // SubmitAttestation advances the ism state and authorizes a batch of messages
  // in a single step.
  rpc SubmitAttestation(MsgSubmitAttestation) returns (MsgSubmitAttestationResponse);

  // SetEnclaveIdentities replaces the set of enclaves that may advance an ism.
  // Owner only.
  rpc SetEnclaveIdentities(MsgSetEnclaveIdentities) returns (MsgSetEnclaveIdentitiesResponse);

  // UpdateOwner transfers an ism to a new owner. Owner only.
  rpc UpdateOwner(MsgUpdateOwner) returns (MsgUpdateOwnerResponse);

  // SetVerifierOverrides sets or clears an ism's overrides of Intel's side of
  // verification. Owner only.
  rpc SetVerifierOverrides(MsgSetVerifierOverrides) returns (MsgSetVerifierOverridesResponse);
}

// MsgCreateInterchainSecurityModule is the request type for CreateInterchainSecurityModule.
message MsgCreateInterchainSecurityModule {
  option (cosmos.msg.v1.signer) = "creator";

  // creator is the message sender.
  string creator = 1;
  // initial trusted state, which pins the origin light client checkpoint
  bytes state = 2;
  // origin merkle tree hook address in bytes32 format
  bytes merkle_tree_address = 3;
  // Field 4 held a single pinned identity before an ism pinned a set.
  reserved 4;
  reserved "identity";
  // every enclave permitted to advance this ism; any one may attest. 1 to
  // MaxEnclaveIdentities, no duplicates. The initial state must carry their set
  // digest.
  repeated EnclaveIdentity identities = 5;
}

// MsgCreateInterchainSecurityModuleResponse is the response type for CreateInterchainSecurityModule.
message MsgCreateInterchainSecurityModuleResponse {
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
}

// MsgSubmitAttestation is the request type for SubmitAttestation.
//
// Unlike a proof-carrying ISM, one attestation authorizes both the state
// transition and the message batch. The enclave already signs a single payload
// covering both, so splitting them into two transactions would only re-verify the
// same quote twice.
message MsgSubmitAttestation {
  option (cosmos.msg.v1.signer) = "signer";

  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // the raw TDX quote produced by the enclave
  bytes quote = 2;
  // the dstack event log, as dstack returned it (JSON)
  bytes event_log = 3;
  // Intel PCS artifacts the quote is verified against
  Collateral collateral = 4;
  // the canonically encoded attested update the quote commits to
  bytes payload = 5;
  // the tx signer address
  string signer = 6;
}

// MsgSubmitAttestationResponse is the response type for SubmitAttestation.
message MsgSubmitAttestationResponse {
  // new ism state (hex-encoded)
  string state = 1;
  // new origin state root (hex-encoded)
  string state_root = 2;
  // Field 3 listed the authorized message ids when attestations named them.
  reserved 3;
  reserved "messages";
  // the attested origin merkle tree root (hex-encoded), which delivery proofs
  // are checked against
  string tree_root = 4;
  // the origin tree's leaf count at that root
  uint32 tree_count = 5;
}

// MsgSetEnclaveIdentities is the request type for SetEnclaveIdentities.
//
// The owner's control over which enclaves advance an ism: when the enclave's
// platform changes under it (a new OS image, new firmware), when an enclave is
// added for redundancy, or when one is retired. The whole set is replaced at once,
// so a rotation is: pin {old, new}, move the relayer, pin {new}. The trusted state
// keeps its root, height and light client store; only the identity digest it
// carries is swapped for the new set digest, so nothing in flight is lost.
message MsgSetEnclaveIdentities {
  option (cosmos.msg.v1.signer) = "owner";

  // the ism owner
  string owner = 1;
  // ism identifier
  string id = 2 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // every enclave permitted to advance this ism from now on; any one may attest.
  // 1 to MaxEnclaveIdentities, no duplicates.
  repeated EnclaveIdentity identities = 3;
}

// MsgSetEnclaveIdentitiesResponse is the response type for SetEnclaveIdentities.
message MsgSetEnclaveIdentitiesResponse {}

// MsgUpdateOwner is the request type for UpdateOwner.
message MsgUpdateOwner {
  option (cosmos.msg.v1.signer) = "owner";

  // the ism owner
  string owner = 1;
  // ism identifier
  string id = 2 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // the owner from now on
  string new_owner = 3;
}

// MsgUpdateOwnerResponse is the response type for UpdateOwner.
message MsgUpdateOwnerResponse {}

// MsgSetVerifierOverrides is the request type for SetVerifierOverrides.
message MsgSetVerifierOverrides {
  option (cosmos.msg.v1.signer) = "owner";

  // the ism owner
  string owner = 1;
  // ism identifier
  string id = 2 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // the overrides from now on; unset or empty clears them
  VerifierOverrides overrides = 3;
}

// MsgSetVerifierOverridesResponse is the response type for SetVerifierOverrides.
message MsgSetVerifierOverridesResponse {}
