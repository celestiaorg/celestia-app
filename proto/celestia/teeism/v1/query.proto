syntax = "proto3";

package celestia.teeism.v1;

import "celestia/teeism/v1/types.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "google/api/annotations.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/celestiaorg/celestia-app/x/teeism/types";

// Query defines the teeism module Query service.
service Query {
  // Ism defines an rpc method for querying an ISM by ID.
  rpc Ism(QueryIsmRequest) returns (QueryIsmResponse) {
    option (google.api.http).get = "/celestia/teeism/v1/isms/{id}";
  }

  // Isms defines an rpc method for querying all ISMs.
  rpc Isms(QueryIsmsRequest) returns (QueryIsmsResponse) {
    option (google.api.http).get = "/celestia/teeism/v1/isms";
  }

  // Roots defines an rpc method for querying the origin tree roots an ism has
  // attested, any of which a delivery proof may be checked against.
  rpc Roots(QueryRootsRequest) returns (QueryRootsResponse) {
    option (google.api.http).get = "/celestia/teeism/v1/roots/{id}";
  }
}

// QueryIsmRequest is the request type for the Ism rpc method.
message QueryIsmRequest {
  // id is the hex-encoded ISM identifier.
  string id = 1;
}

// QueryIsmResponse is the response type for the Ism rpc method.
message QueryIsmResponse {
  // the ism associated with the provided identifier.
  InterchainSecurityModule ism = 1 [(gogoproto.nullable) = false];
}

// QueryIsmsRequest is the request type for the Isms rpc method.
message QueryIsmsRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryIsmsResponse is the response type for the Isms rpc method.
message QueryIsmsResponse {
  // isms is a list of tee isms.
  repeated InterchainSecurityModule isms = 1 [(gogoproto.nullable) = false];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryRootsRequest is the request type for the Roots rpc method.
message QueryRootsRequest {
  // id is the hex-encoded ISM identifier.
  string id = 1;
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryRootsResponse is the response type for the Roots rpc method.
message QueryRootsResponse {
  // roots is a list of attested origin merkle tree roots (hex-encoded).
  repeated string roots = 1;
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
