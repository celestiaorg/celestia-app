syntax = "proto3";
package celestia.fibre.v1;

import "celestia/fibre/v1/fibre.proto";

option go_package = "github.com/celestiaorg/celestia-app/x/fibre/types";

// BlobRow represents a row of data in a Fibre blob.
message BlobRow {
  uint32 index = 1;
  bytes data = 2;
  repeated bytes proof = 3;
}

// BlobShard represents a subset of rows of a Fibre blob.
// Contains row data along with the RLC (random linear combination) vector
// computed during upload: flattened, 16 bytes per original row.
message BlobShard {
  repeated BlobRow rows = 1;
  bytes rlcs = 2; // flattened RLC vector, 16 bytes per original row
}

// UploadShardRequest is the request message for the UploadShard RPC method.
message UploadShardRequest {
  celestia.fibre.v1.PaymentPromise promise = 1;
  BlobShard shard = 2;
}

// UploadShardResponse is the response message for the UploadShard RPC method.
message UploadShardResponse {
  bytes validator_signature = 1; // const len == 32
}

// DownloadShardRequest is the request message for the DownloadShard RPC method.
message DownloadShardRequest {
  bytes blob_id = 1; // const len == 33 (version + commitment)
}

// DownloadShardResponse is the response message for the unary DownloadShard RPC.
message DownloadShardResponse {
  BlobShard shard = 1;
}

// ShardHeader carries the RLC vector and the number of rows that follow,
// so the client can preallocate and validate the row count.
message ShardHeader {
  bytes rlcs = 1;
  uint32 num_rows = 2;
}

// DownloadShardStreamResponse is one message of the DownloadShardStream server
// stream: a ShardHeader first, then one BlobRow per message.
message DownloadShardStreamResponse {
  // chunk is the header on the first message, then a row on each subsequent one.
  oneof chunk {
    ShardHeader header = 1;
    BlobRow row = 2;
  }
}

// Fibre defines the gRPC service for uploading and downloading fibre blob shards.
service Fibre {
  // UploadShard uploads a blob shard with its RLC vector to a validator.
  rpc UploadShard(UploadShardRequest) returns (UploadShardResponse);
  // DownloadShard downloads a whole blob shard in a single response.
  rpc DownloadShard(DownloadShardRequest) returns (DownloadShardResponse);
  // DownloadShardStream streams a blob shard: a ShardHeader followed by one row
  // per message, so the server never holds the whole shard in memory.
  rpc DownloadShardStream(DownloadShardRequest) returns (stream DownloadShardStreamResponse);
}
