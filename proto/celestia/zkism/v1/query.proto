syntax = "proto3";

package celestia.zkism.v1;

import "celestia/zkism/v1/types.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "google/api/annotations.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/celestiaorg/celestia-app/x/zkism/types";

// Query defines the zkism module Query service.
service Query {
  // Ism defines an rpc method for querying an ISM by ID.
  rpc Ism(QueryIsmRequest) returns (QueryIsmResponse) {
    option (google.api.http).get = "/celestia/zkism/v1/isms/{id}";
  }

  // Isms defines an rpc method for querying all ISMs.
  rpc Isms(QueryIsmsRequest) returns (QueryIsmsResponse) {
    option (google.api.http).get = "/celestia/zkism/v1/isms";
  }

  // MerkleTreeState defines an rpc method for querying the proven source chain merkle tree state of an ISM.
  rpc MerkleTreeState(QueryMerkleTreeStateRequest) returns (QueryMerkleTreeStateResponse) {
    option (google.api.http).get = "/celestia/zkism/v1/isms/{id}/merkle_tree_state";
  }

  // RootHistory defines an rpc method for querying the replaced state roots and merkle tree states an ISM still
  // accepts.
  rpc RootHistory(QueryRootHistoryRequest) returns (QueryRootHistoryResponse) {
    option (google.api.http).get = "/celestia/zkism/v1/isms/{id}/root_history";
  }
}

// QueryIsmRequest is the request type for the Ism rpc method.
message QueryIsmRequest {
  // id is the hex-encoded ISM identifier.
  string id = 1;
}

// QueryIsmResponse is the response type for the Ism rpc method.
message QueryIsmResponse {
  // the ism associated with the provided identifier.
  InterchainSecurityModule ism = 1 [(gogoproto.nullable) = false];
}

// QueryIsmsRequest is the request type for the Isms rpc method.
message QueryIsmsRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryIsmsResponse is the response type for the Isms rpc method.
message QueryIsmsResponse {
  // isms is a list of zk execution isms.
  repeated InterchainSecurityModule isms = 1 [(gogoproto.nullable) = false];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryMerkleTreeStateRequest is the request type for the MerkleTreeState rpc method.
message QueryMerkleTreeStateRequest {
  // id is the hex-encoded ISM identifier.
  string id = 1;
}

// QueryMerkleTreeStateResponse is the response type for the MerkleTreeState rpc method.
message QueryMerkleTreeStateResponse {
  // tree_state is the latest proven source chain merkle tree state.
  MerkleTreeState tree_state = 1 [(gogoproto.nullable) = false];
}

// QueryRootHistoryRequest is the request type for the RootHistory rpc method.
message QueryRootHistoryRequest {
  // id is the hex-encoded ISM identifier.
  string id = 1;
}

// QueryRootHistoryResponse is the response type for the RootHistory rpc method.
message QueryRootHistoryResponse {
  // root_history_size is the number of replaced roots the ISM keeps.
  uint32 root_history_size = 1;
  // state_roots are the replaced state roots still accepted for membership proofs, oldest first.
  repeated RootHistoryEntry state_roots = 2 [(gogoproto.nullable) = false];
  // tree_states are the replaced merkle tree states still accepted for message verification, oldest first.
  repeated RootHistoryEntry tree_states = 3 [(gogoproto.nullable) = false];
}
