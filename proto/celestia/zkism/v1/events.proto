syntax = "proto3";

package celestia.zkism.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/celestiaorg/celestia-app/x/zkism/types";

// EventCreateInterchainSecurityModule defines the event type emitted when creating a new InterchainSecurityModule.
message EventCreateInterchainSecurityModule {
  option (gogoproto.goproto_getters) = false;

  // unique hyperlane identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // the owner or creator of the ism
  string owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // latest state
  string state = 3;
  // merkle tree address in bytes32 format
  string merkle_tree_address = 4;
  // the sp1 groth16 verifier key (hex-encoded)
  string groth16_vkey = 5;
  // hash-based commitment to the verifier key used for state transition (hex-encoded)
  string state_transition_vkey = 6;
  // hash-based commitment to the verifier key used for state membership (hex-encoded)
  string state_membership_vkey = 7;
}

// EventUpdateInterchainSecurityModule defines the event type emitted when updating a InterchainSecurityModule.
message EventUpdateInterchainSecurityModule {
  option (gogoproto.goproto_getters) = false;

  // unique hyperlane identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // new state
  string state = 2;
}

// EventSubmitMessages defines the event type emitted after successful message submission.
message EventSubmitMessages {
  option (gogoproto.goproto_getters) = false;

  // unique hyperlane identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  reserved 3;
  reserved "messages";

  // state commitment root used to verify messages (hex-encoded)
  string state_root = 2;
  // source chain merkle tree root that messages are verified against (hex-encoded)
  string tree_root = 4;
  // number of leaves in the source chain merkle tree
  uint32 count = 5;
}

// EventUpdateVerifyingKeys defines the event type emitted when the owner replaces the verifying keys of an ism.
message EventUpdateVerifyingKeys {
  option (gogoproto.goproto_getters) = false;

  // unique hyperlane identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // the sp1 groth16 verifier key (hex-encoded)
  string groth16_vkey = 2;
  // hash-based commitment to the verifier key used for state transition (hex-encoded)
  string state_transition_vkey = 3;
  // hash-based commitment to the verifier key used for state membership (hex-encoded)
  string state_membership_vkey = 4;
}
