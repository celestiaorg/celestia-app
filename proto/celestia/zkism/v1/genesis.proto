syntax = "proto3";

package celestia.zkism.v1;

import "celestia/zkism/v1/types.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/celestiaorg/celestia-app/x/zkism/types";

// GenesisState defines the zkism module's genesis state.
message GenesisState {
  // list of zk execution isms.
  repeated InterchainSecurityModule isms = 1 [(gogoproto.nullable) = false];
  reserved 2;
  reserved "messages";

  // deprecated: submissions are no longer tracked; ignored on import and never exported.
  repeated GenesisProofSubmission submissions = 3 [(gogoproto.nullable) = false, deprecated = true];
  // source chain merkle tree state proven for each zk execution ism.
  repeated GenesisMerkleTreeState tree_states = 4 [(gogoproto.nullable) = false];
  // replaced state roots still accepted for each zk execution ism.
  repeated GenesisRootHistoryEntry state_root_history = 5 [(gogoproto.nullable) = false];
  // replaced merkle tree states still accepted for each zk execution ism.
  repeated GenesisRootHistoryEntry tree_state_history = 6 [(gogoproto.nullable) = false];
}

// GenesisProofSubmission contains the proof submission state for a zk execution ism.
message GenesisProofSubmission {
  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // whether a message proof has been submitted for the current state root
  bool submitted = 2;
}

// GenesisMerkleTreeState contains the proven source chain merkle tree state for a zk execution ism.
message GenesisMerkleTreeState {
  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // proven merkle tree state
  MerkleTreeState tree_state = 2 [(gogoproto.nullable) = false];
}

// GenesisRootHistoryEntry is a root history entry of a zk execution ism.
message GenesisRootHistoryEntry {
  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // position of the entry in the ism history; entries are ordered oldest to newest
  uint64 sequence = 2;
  // history entry
  RootHistoryEntry entry = 3 [(gogoproto.nullable) = false];
}
