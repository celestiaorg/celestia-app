syntax = "proto3";

package celestia.zkism.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/celestiaorg/celestia-app/x/zkism/types";

// Msg defines the zkism module Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // CreateInterchainSecurityModule defines the rpc method for creating a new zk ISM.
  rpc CreateInterchainSecurityModule(MsgCreateInterchainSecurityModule)
      returns (MsgCreateInterchainSecurityModuleResponse);

  // UpdateInterchainSecurityModule defines the rpc method for updating an existing zk ISM.
  rpc UpdateInterchainSecurityModule(MsgUpdateInterchainSecurityModule)
      returns (MsgUpdateInterchainSecurityModuleResponse);

  // SubmitMessages defines the rpc method for verifying state membership of messages.
  rpc SubmitMessages(MsgSubmitMessages) returns (MsgSubmitMessagesResponse);

  // UpdateVerifyingKeys defines the rpc method for the ISM owner to replace the verifying keys of a zk ISM.
  rpc UpdateVerifyingKeys(MsgUpdateVerifyingKeys) returns (MsgUpdateVerifyingKeysResponse);

  // TransferOwnership defines the rpc method for the ISM owner to transfer or renounce ownership of a zk ISM.
  rpc TransferOwnership(MsgTransferOwnership) returns (MsgTransferOwnershipResponse);

  // UpdateRootHistorySize defines the rpc method for the ISM owner to change how many replaced roots a zk ISM keeps.
  rpc UpdateRootHistorySize(MsgUpdateRootHistorySize) returns (MsgUpdateRootHistorySizeResponse);
}

// MsgCreateInterchainSecurityModule is the request type for CreateInterchainSecurityModule.
message MsgCreateInterchainSecurityModule {
  option (cosmos.msg.v1.signer) = "creator";
  // creator is the message sender.
  string creator = 1;
  // initial trusted state
  bytes state = 2;
  // merkle tree address in byte32 format
  bytes merkle_tree_address = 3;
  // the sp1 groth16 verifier key
  bytes groth16_vkey = 4;
  // hash-based commitment to the verifier key used for state transition
  bytes state_transition_vkey = 5;
  // hash-based commitment to the verifier key used for state membership
  bytes state_membership_vkey = 6;
  // number of replaced roots kept as history; 0 means DefaultRootHistorySize
  uint32 root_history_size = 7;
}

// MsgCreateInterchainSecurityModuleResponse is the response type for CreateInterchainSecurityModule.
message MsgCreateInterchainSecurityModuleResponse {
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
}

// MsgUpdateInterchainSecurityModule is the request type for UpdateInterchainSecurityModule.
message MsgUpdateInterchainSecurityModule {
  option (cosmos.msg.v1.signer) = "signer";

  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // proof is the ZK proof bytes (groth16).
  bytes proof = 2;
  // the public values used for proof verification.
  bytes public_values = 3;
  // the tx signer address
  string signer = 4;
}

// MsgUpdateInterchainSecurityModuleResponse is the response type for UpdateInterchainSecurityModule.
message MsgUpdateInterchainSecurityModuleResponse {
  // new ism state
  bytes state = 1;
}

// MsgSubmitMessages is the request type for SubmitMessages.
message MsgSubmitMessages {
  option (cosmos.msg.v1.signer) = "signer";

  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // proof is the ZK proof bytes (groth16).
  bytes proof = 2;
  // the public values used for proof verification.
  bytes public_values = 3;
  // the tx signer address
  string signer = 4;
}

// MsgSubmitMessagesResponse is the response type for SubmitMessages.
message MsgSubmitMessagesResponse {
  reserved 2;
  reserved "messages";

  // state commitment root used to verify messages (hex-encoded)
  string state_root = 1;
  // source chain merkle tree root that messages are verified against (hex-encoded)
  string tree_root = 3;
  // number of leaves in the source chain merkle tree
  uint32 count = 4;
}

// MsgUpdateVerifyingKeys is the request type for UpdateVerifyingKeys.
message MsgUpdateVerifyingKeys {
  option (cosmos.msg.v1.signer) = "owner";

  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // owner is the ism owner and message sender.
  string owner = 2;
  // the sp1 groth16 verifier key
  bytes groth16_vkey = 3;
  // hash-based commitment to the verifier key used for state transition
  bytes state_transition_vkey = 4;
  // hash-based commitment to the verifier key used for state membership
  bytes state_membership_vkey = 5;
}

// MsgUpdateVerifyingKeysResponse is the response type for UpdateVerifyingKeys.
message MsgUpdateVerifyingKeysResponse {}

// MsgTransferOwnership is the request type for TransferOwnership. Exactly one of new_owner and renounce_ownership
// must be set. Renouncing ownership is irreversible: no account can update the verifying keys afterwards.
message MsgTransferOwnership {
  option (cosmos.msg.v1.signer) = "owner";

  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // owner is the current ism owner and message sender.
  string owner = 2;
  // new_owner is the address that becomes the ism owner. Must be empty when renouncing ownership.
  string new_owner = 3;
  // renounce_ownership permanently removes the owner of the ism. Must be false when setting a new owner.
  bool renounce_ownership = 4;
}

// MsgTransferOwnershipResponse is the response type for TransferOwnership.
message MsgTransferOwnershipResponse {}

// MsgUpdateRootHistorySize is the request type for UpdateRootHistorySize.
message MsgUpdateRootHistorySize {
  option (cosmos.msg.v1.signer) = "owner";

  // ism identifier
  string id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // owner is the ism owner and message sender.
  string owner = 2;
  // number of replaced roots kept as history; 0 means DefaultRootHistorySize
  uint32 root_history_size = 3;
}

// MsgUpdateRootHistorySizeResponse is the response type for UpdateRootHistorySize.
message MsgUpdateRootHistorySizeResponse {}
