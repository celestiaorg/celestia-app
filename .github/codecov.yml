comment: false

# Eligible coverage scope: production code only. Keep this in sync with
# OUT_OF_SCOPE in scripts/test_cover.sh.
ignore:
  # Generated protobuf code.
  - "**/*.pb.go"
  - "**/*.pb.gw.go"
  # Test utilities and one-off CLI tools.
  - "test/**/*"
  - "tools/**/*"
  # Developer scripts, local devnet helpers and test vector generators.
  - "scripts/**/*"
  - "local_devnet/**/*"
  - "pkg/rsema1d/cmd/testvectors/**/*"

# All production packages are covered by the global rule without a component list.
# Stage 1: limit regressions against the base report. Goals stay informational
# until each corrected full-suite baseline reaches them; see docs/coverage.md.
coverage:
  status:
    patch: false
    project:
      default: &non_regression
        target: auto
        # Allow small run-to-run coverage fluctuations (percentage points).
        threshold: 0.5%
        if_ci_failed: error
        if_no_uploads: error
        if_not_found: failure
      production-goal:
        target: 80%
        informational: true

component_management:
  default_rules:
    statuses:
      - type: project
        name_prefix: non-regression
        <<: *non_regression
      - type: project
        name_prefix: goal
        target: 95%
        informational: true
  individual_components:
    - component_id: prepare-proposal
      paths: ["app/prepare_proposal.go"]
    - component_id: process-proposal
      paths: ["app/process_proposal.go"]
