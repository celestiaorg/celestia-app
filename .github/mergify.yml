pull_request_rules:
  - name: backport patches to v1.x branch
    conditions:
      - base=main
      - label=backport:v1.x
    actions:
      backport:
        branches:
          - v1.x
  - name: backport patches to v2.x branch
    conditions:
      - base=main
      - label=backport:v2.x
    actions:
      backport:
        branches:
          - v2.x
  - name: backport patches to v3.x branch
    conditions:
      - base=main
      - label=backport:v3.x
    actions:
      backport:
        branches:
          - v3.x
  - name: backport patches to v4.x branch
    conditions:
      - base=main
      - label=backport:v4.x
    actions:
      backport:
        branches:
          - v4.x
  - name: backport patches to v5.x branch
    conditions:
      - base=main
      - label=backport:v5.x
    actions:
      backport:
        branches:
          - v5.x
  - name: backport patches to v6.x branch
    conditions:
      - base=main
      - label=backport:v6.x
    actions:
      backport:
        branches:
          - v6.x
  - name: backport patches to v7.x branch
    conditions:
      - base=main
      - label=backport:v7.x
    actions:
      backport:
        branches:
          - v7.x
  - name: backport patches to v8.x branch
    conditions:
      - base=main
      - label=backport:v8.x
    actions:
      backport:
        branches:
          - v8.x
  - name: backport patches to v9.x branch
    conditions:
      - base=main
      - label=backport:v9.x
    actions:
      backport:
        branches:
          - v9.x
  - name: backport patches to v10.x branch
    conditions:
      - base=main
      - label=backport:v10.x
    actions:
      backport:
        branches:
          - v10.x
  - name: backport patches to v11.x branch
    conditions:
      # Also match base=v10.x so v10.x-only fixes (with no main equivalent)
      # carry forward to v11.x while both release lines are supported.
      - or:
          - base=main
          - base=v10.x
      - label=backport:v11.x
    actions:
      backport:
        branches:
          - v11.x
  - name: forward-port patches to main branch
    conditions:
      - label=forwardport:main
    actions:
      backport:
        branches:
          - main
merge_queue:
  status_comments: none
  queue_controls_comment: false
