name: Set up Go and download modules
description: Restore Go caches and retry module downloads before running checks.
inputs:
  module-directory:
    description: Directory containing the module to download.
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          test/docker-e2e/go.sum
    - name: Download Go modules
      shell: bash
      env:
        MODULE_DIRECTORY: ${{ inputs.module-directory }}
      run: sh docker/download-go-modules.sh "$MODULE_DIRECTORY"
