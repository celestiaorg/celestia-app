name: Corto public address diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-address:
    runs-on: ubuntu-latest
    steps:
      - name: Derive public address only
        env:
          CORTO_PRIV_KEY: ${{ secrets.CORTO_PRIV_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          function address(pubkey) {
            const data = crypto.createHash('ripemd160').update(crypto.createHash('sha256').update(pubkey).digest()).digest();
            const hrp = 'celestia';
            const words = [];
            let acc = 0, bits = 0;
            for (const byte of data) {
              acc = ((acc << 8) | byte) & 0xffff;
              bits += 8;
              while (bits >= 5) { bits -= 5; words.push((acc >>> bits) & 31); }
            }
            if (bits) words.push((acc << (5 - bits)) & 31);
            const expanded = [...hrp].map(c => c.charCodeAt(0) >>> 5).concat([0], [...hrp].map(c => c.charCodeAt(0) & 31));
            let chk = 1;
            const generators = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
            for (const v of [...expanded, ...words, 0, 0, 0, 0, 0, 0]) {
              const top = chk >>> 25;
              chk = ((chk & 0x1ffffff) << 5) ^ v;
              for (let i = 0; i < 5; i++) if ((top >>> i) & 1) chk ^= generators[i];
            }
            chk ^= 1;
            const checksum = Array.from({length: 6}, (_, i) => (chk >>> (5 * (5 - i))) & 31);
            const alphabet = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
            return hrp + '1' + [...words, ...checksum].map(v => alphabet[v]).join('');
          }
          if (process.argv[2] === '--self-test') {
            const actual = address(Buffer.from('AiiXnqGTuMgjADuNSLosc4DeyAGuph3p8U3/hznGcxD+', 'base64'));
            if (actual !== 'celestia1f909e5ee7v4ctsj67djsg34atflvga93cx0428') throw new Error('Address encoding self-test failed');
            console.log('Public-address self-test passed');
          } else {
            const hex = process.env.CORTO_PRIV_KEY || '';
            if (!/^[0-9a-fA-F]{64}$/.test(hex)) throw new Error('Expected a 32-byte hex key');
            const ecdh = crypto.createECDH('secp256k1');
            ecdh.setPrivateKey(Buffer.from(hex, 'hex'));
            console.log('Corto nightly public address: ' + address(ecdh.getPublicKey(undefined, 'compressed')));
          }
          NODE
