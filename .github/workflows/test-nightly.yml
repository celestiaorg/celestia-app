name: Nightly Tests

# BISECT BRANCH for PROTOCO-3764. Do not merge. This trimmed copy of the
# nightly runs only TestRollback and TestAllUpgrades, has a per-branch
# concurrency group, and has no Slack, Linear, fuzz or race jobs.
concurrency:
  group: nightly-bisect-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to test (leave empty to use commit SHA)"
        required: false
        type: string

jobs:
  build-e2e-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: ${{ inputs.tag == '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Generate image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Validate against Docker's tag grammar,
            # [A-Za-z0-9_][A-Za-z0-9._-]{0,127}. This keeps shell
            # metacharacters out of the steps that consume the tag and stops a
            # newline from smuggling extra lines into $GITHUB_OUTPUT. Checking
            # the full grammar (not just the charset) also fails here with a
            # clear message, rather than later on an opaque "invalid reference
            # format" from docker build.
            case "$INPUT_TAG" in
              [!A-Za-z0-9_]* | *[!A-Za-z0-9._-]*)
                echo "::error::Invalid tag '$INPUT_TAG': must match [A-Za-z0-9_][A-Za-z0-9._-]{0,127}"
                exit 1
                ;;
            esac
            if [ "${#INPUT_TAG}" -gt 128 ]; then
              echo "::error::Invalid tag '$INPUT_TAG': ${#INPUT_TAG} characters, max 128"
              exit 1
            fi
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: ${{ inputs.tag == '' }}
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker build -t "ghcr.io/celestiaorg/celestia-app:${TAG}" . -f docker/multiplexer.Dockerfile

      - name: Save Docker image as artifact
        if: ${{ inputs.tag == '' }}
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker save "ghcr.io/celestiaorg/celestia-app:${TAG}" | gzip > /tmp/e2e-image.tar.gz

      - name: Upload Docker image artifact
        if: ${{ inputs.tag == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: e2e-image
          path: /tmp/e2e-image.tar.gz
          retention-days: 1

    outputs:
      tag: ${{ steps.tag.outputs.value }}

  test-nightly:
    needs: [build-e2e-image]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestAllUpgrades
            max-attempts: 2
          - test: TestRollback
            max-attempts: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          module-directory: test/docker-e2e

      - name: Download Docker image artifact
        if: ${{ inputs.tag == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: e2e-image
          path: /tmp

      - name: Load Docker image
        if: ${{ inputs.tag == '' }}
        run: docker load < /tmp/e2e-image.tar.gz

      - name: Run ${{ matrix.test }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: ${{ matrix.max-attempts || 1 }}
          command: make test-docker-e2e test=${{ matrix.test }} entrypoint=TestCelestiaTestSuite
        env:
          CELESTIA_IMAGE: ghcr.io/celestiaorg/celestia-app
          CELESTIA_TAG: ${{ needs.build-e2e-image.outputs.tag }}
          CELESTIA_APP_VERSION: ${{ needs.build-e2e-image.outputs.tag }}
