name: Nightly Tests

concurrency:
  group: nightly-tests
  cancel-in-progress: true

on:
  schedule:
    # run nightly at 2 AM UTC
    - cron: "0 2 * * *"
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to test (leave empty to use commit SHA)"
        required: false
        type: string

jobs:
  build-e2e-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: ${{ inputs.tag == '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Generate image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Validate against Docker's tag grammar,
            # [A-Za-z0-9_][A-Za-z0-9._-]{0,127}. This keeps shell
            # metacharacters out of the steps that consume the tag and stops a
            # newline from smuggling extra lines into $GITHUB_OUTPUT. Checking
            # the full grammar (not just the charset) also fails here with a
            # clear message, rather than later on an opaque "invalid reference
            # format" from docker build.
            case "$INPUT_TAG" in
              [!A-Za-z0-9_]* | *[!A-Za-z0-9._-]*)
                echo "::error::Invalid tag '$INPUT_TAG': must match [A-Za-z0-9_][A-Za-z0-9._-]{0,127}"
                exit 1
                ;;
            esac
            if [ "${#INPUT_TAG}" -gt 128 ]; then
              echo "::error::Invalid tag '$INPUT_TAG': ${#INPUT_TAG} characters, max 128"
              exit 1
            fi
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: ${{ inputs.tag == '' }}
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker build -t "ghcr.io/celestiaorg/celestia-app:${TAG}" . -f docker/multiplexer.Dockerfile

      - name: Save Docker image as artifact
        if: ${{ inputs.tag == '' }}
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker save "ghcr.io/celestiaorg/celestia-app:${TAG}" | gzip > /tmp/e2e-image.tar.gz

      - name: Upload Docker image artifact
        if: ${{ inputs.tag == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: e2e-image
          path: /tmp/e2e-image.tar.gz
          retention-days: 1

    outputs:
      tag: ${{ steps.tag.outputs.value }}

  # Build the latency-monitor image once and share it with every test that
  # needs it via an artifact, rather than rebuilding it in each matrix job.
  build-latency-monitor-image:
    needs: build-e2e-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Build latency-monitor Docker image
        env:
          TAG: ${{ needs.build-e2e-image.outputs.tag }}
        run: >-
          docker build
          -t "ghcr.io/celestiaorg/latency-monitor:${TAG}"
          -f docker/latency-monitor/Dockerfile .

      - name: Save Docker image as artifact
        env:
          TAG: ${{ needs.build-e2e-image.outputs.tag }}
        run: docker save "ghcr.io/celestiaorg/latency-monitor:${TAG}" | gzip > /tmp/latency-monitor-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: latency-monitor-image
          path: /tmp/latency-monitor-image.tar.gz
          retention-days: 1

  test-nightly:
    needs: [build-e2e-image, build-latency-monitor-image]
    runs-on: ubuntu-latest
    # Generous budget so the retried sync tests (up to 3 attempts of up to 30
    # minutes each) have headroom without prematurely killing the long-running
    # upgrade tests.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # TestSyncToTipMocha syncs against the live mocha testnet and can
          # intermittently stall when no connected peer is serving a usable
          # state-sync snapshot. Retry it before failing the nightly. Other
          # tests default to a single attempt so real failures aren't masked.
          - test: TestSyncToTipMocha
            max-attempts: 3
          # TestAllUpgrades starts a fresh chain per upgrade step; on shared
          # runners an older-version chain occasionally misses the startup
          # deadline, so retry once before failing the nightly.
          - test: TestAllUpgrades
            max-attempts: 2
          # The genesis sync tests block sync the first block from live public
          # archive peers, which often have every inbound slot taken for
          # minutes at a time, so retry twice before failing the nightly.
          - test: TestGenesisSyncMocha
            max-attempts: 3
          - test: TestGenesisSyncMainnet
            max-attempts: 3
          # TestRollback restarts every validator twice on a shared runner;
          # retry once so a slow container restart does not fail the nightly.
          - test: TestRollback
            max-attempts: 2
          - test: TestSurgeryDA
          - test: TestCortoLoad
            extra-image: true
          # Export and restart from the export: core state, then IBC/ICA and
          # Hyperlane with the same chain-id, and IBC with a new chain-id
          # recovered by governance.
          - test: TestExportRestart
          - test: TestExportRestartNewChainID
          - test: TestIBCExportRestart
            entrypoint: TestIBCTestSuite
          - test: TestIBCExportRestartNewChainID
            entrypoint: TestIBCTestSuite
          - test: TestHyperlaneExportRestart
            entrypoint: TestHyperlaneTestSuite
          # Export below the last height Hermes relayed.
          - test: TestIBCExportBelowTip
            entrypoint: TestIBCTestSuite
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          module-directory: test/docker-e2e

      - name: Download Docker image artifact
        if: ${{ inputs.tag == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: e2e-image
          path: /tmp

      - name: Load Docker image
        if: ${{ inputs.tag == '' }}
        run: docker load < /tmp/e2e-image.tar.gz

      - name: Download latency-monitor image artifact
        if: ${{ matrix.extra-image }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: latency-monitor-image
          path: /tmp

      - name: Load latency-monitor Docker image
        if: ${{ matrix.extra-image }}
        run: docker load < /tmp/latency-monitor-image.tar.gz

      # TestCortoLoad skips itself when its env vars are absent so it can be
      # run selectively in local development. In the nightly that skip would
      # silently disable the load test, so fail fast if the secrets are unset.
      - name: Verify Corto secrets are set
        if: ${{ matrix.test == 'TestCortoLoad' }}
        env:
          CORTO_PRIV_KEY: ${{ secrets.CORTO_PRIV_KEY }}
          CORTO_RPC: ${{ secrets.CORTO_RPC }}
          CORTO_GRPC: ${{ secrets.CORTO_GRPC }}
          CORTO_AUTH_TOKEN: ${{ secrets.CORTO_AUTH_TOKEN }}
        run: |
          missing=""
          [ -z "$CORTO_PRIV_KEY" ] && missing="$missing CORTO_PRIV_KEY"
          [ -z "$CORTO_RPC" ] && missing="$missing CORTO_RPC"
          [ -z "$CORTO_GRPC" ] && missing="$missing CORTO_GRPC"
          [ -z "$CORTO_AUTH_TOKEN" ] && missing="$missing CORTO_AUTH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets for TestCortoLoad:$missing"
            exit 1
          fi

      - name: Run ${{ matrix.test }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          # Per-attempt cap; comfortably above a single run of any nightly test.
          timeout_minutes: 30
          # Defaults to 1 attempt (no retry) for tests that don't opt in.
          max_attempts: ${{ matrix.max-attempts || 1 }}
          command: make test-docker-e2e test=${{ matrix.test }} entrypoint=${{ matrix.entrypoint || 'TestCelestiaTestSuite' }}
        env:
          CELESTIA_IMAGE: ghcr.io/celestiaorg/celestia-app
          CELESTIA_TAG: ${{ needs.build-e2e-image.outputs.tag }}
          CORTO_PRIV_KEY: ${{ secrets.CORTO_PRIV_KEY }}
          CORTO_RPC: ${{ secrets.CORTO_RPC }}
          CORTO_GRPC: ${{ secrets.CORTO_GRPC }}
          CORTO_AUTH_TOKEN: ${{ secrets.CORTO_AUTH_TOKEN }}
          CELESTIA_APP_VERSION: ${{ needs.build-e2e-image.outputs.tag }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          PUSHGATEWAY_USERNAME: ${{ secrets.PUSHGATEWAY_USERNAME }}
          PUSHGATEWAY_PASSWORD: ${{ secrets.PUSHGATEWAY_PASSWORD }}

  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [unit, ./app/test, ./fibre/..., ./tools/fibre-txsim]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - uses: ./.github/actions/setup-go

      - name: Run tests in race mode
        env:
          RACE_PACKAGE: ${{ matrix.package }}
          # Avoid compiling and running several memory-heavy packages together.
          GOFLAGS: -p=2
        run: |
          set -o pipefail
          if [ "$RACE_PACKAGE" = unit ]; then
            excluded=$(go list ./app/test ./fibre/... ./tools/fibre-txsim)
            packages=$(go list ./... | grep -Fxv -f <(printf '%s\n' "$excluded") | tr '\n' ' ')
            make test-race PACKAGES="$packages"
          else
            make test-race PACKAGES="$RACE_PACKAGE"
          fi

  # Checks the fuzz target registry and turns it into the test-fuzz matrix, so
  # adding a target to scripts/fuzz_targets.txt needs no workflow edit. A
  # matrix is capped at 256 jobs; the registry is well below that.
  fuzz-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Check fuzz target registry
        run: scripts/test_fuzz.sh --check

      - name: List fuzz targets
        id: list
        run: |
          matrix=$(scripts/test_fuzz.sh --list-json)
          count=$(echo "$matrix" | jq length)
          echo "$count fuzz targets"
          if [ "$count" -eq 0 ] || [ "$count" -gt 256 ]; then
            echo "::error::Fuzz matrix has $count targets; it must have 1 to 256"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # WARNING: Required job — a defense line against codec / wire-format bugs,
  # including the fibre scatter codec. The fuzz targets live in
  # scripts/fuzz_targets.txt. Do NOT remove or disable this job; doing so
  # re-opens https://github.com/celestiaorg/celestia-app/issues/7392.
  #
  # Each registered target runs on its own runner. Fuzz output can contain a
  # crashing input for an exploitable bug, so it stays out of the public log
  # and is sent to a Linear issue instead.
  #
  # Each target's generated corpus is cached between runs, so every night
  # starts from the inputs earlier nights found. The cache holds only
  # non-crashing inputs: go test writes a crashing input to the package's
  # testdata/fuzz directory, which is never cached or uploaded.
  test-fuzz:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deletes this target's superseded corpus cache entries.
      actions: write
    env:
      # Bump the version to drop every saved corpus. Entries that no longer
      # match a target's signature are skipped by go test, so a signature
      # change does not need a bump.
      CORPUS_KEY: fuzz-corpus-v1-${{ matrix.pkg }}/${{ matrix.target }}-
      # A corpus larger than this is not saved; see docs/fuzzing.md.
      CORPUS_MAX_MIB: 32
    # The longest registry fuzztime is 5m; the rest covers checkout, module
    # download, the instrumented build and minimizing a crashing input.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - uses: ./.github/actions/setup-go

      # Restores the newest corpus saved for this target. It lives outside
      # GOCACHE, so the build cache restored above cannot overwrite it.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ runner.temp }}/fuzz-corpus
          key: ${{ env.CORPUS_KEY }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.CORPUS_KEY }}

      - name: Run ${{ matrix.target }}
        id: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PKG: ${{ matrix.pkg }}
          FUZZ_LOG_DIR: ${{ runner.temp }}/fuzz
          FUZZ_CACHE_DIR: ${{ runner.temp }}/fuzz-corpus
        run: make test-fuzz

      - name: File Linear issues for failing targets
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: PROTOCO
          LINEAR_ASSIGNEE_ID: ${{ vars.FUZZ_LINEAR_ASSIGNEE_ID || 'e9929f5b-e156-4046-95df-aeea6faa9a58' }}
          FUZZ_LOG_DIR: ${{ runner.temp }}/fuzz
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/report-fuzz-failures.py

      # Saves the corpus even when the target fails, so inputs found before a
      # crash are kept.
      - name: Check fuzz corpus size
        id: corpus
        if: ${{ !cancelled() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure') }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_CACHE_DIR: ${{ runner.temp }}/fuzz-corpus
        run: |
          if [ ! -d "$FUZZ_CACHE_DIR" ]; then
            echo "No corpus to save"
            exit 0
          fi
          files=$(find "$FUZZ_CACHE_DIR" -type f | wc -l)
          mib=$(du -sm --apparent-size "$FUZZ_CACHE_DIR" | cut -f1)
          echo "Corpus: $files files, $mib MiB"
          if [ "$mib" -gt "$CORPUS_MAX_MIB" ]; then
            echo "::warning::$FUZZ_TARGET corpus is $mib MiB, over the ${CORPUS_MAX_MIB} MiB cap; not saving it"
            exit 0
          fi
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save fuzz corpus
        id: save-corpus
        if: ${{ !cancelled() && steps.corpus.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ runner.temp }}/fuzz-corpus
          key: ${{ env.CORPUS_KEY }}${{ github.run_id }}-${{ github.run_attempt }}

      # Each save holds the whole corpus, so only the newest entry is needed.
      # Keeping the newest by creation time, not by this run's key, never
      # deletes the last good corpus if the save above did not land.
      - name: Delete superseded fuzz corpora
        if: ${{ !cancelled() && steps.save-corpus.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "$CORPUS_KEY" --limit 100 --json id,key,createdAt |
            jq -r 'sort_by(.createdAt) | reverse | .[1:][] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "Deleting $key"
              gh cache delete "$id" || echo "::warning::Could not delete cache $key"
            done

  notify-slack-on-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: [build-e2e-image, build-latency-monitor-image, test-nightly, test-race, fuzz-targets, test-fuzz]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "test-nightly tests failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
