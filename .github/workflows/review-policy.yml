name: review-policy-evaluator

# Privileged evaluation always uses protected default-branch code. Review and
# queue events arrive through workflow_run, never by executing PR code here.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [review-policy-events]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# Serialize PR status writers. Give each merge-group SHA its own lane so a
# burst of PR events cannot replace a pending queue evaluation. Never cancel
# a running writer halfway through its pending -> final transition.
concurrency:
  group: >-
    review-policy-${{ github.event.workflow_run.event == 'merge_group' &&
    github.event.workflow_run.head_sha || 'pull-requests' }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate review policy
        run: node .github/scripts/review-policy.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
