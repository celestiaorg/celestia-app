name: review-policy-evaluator

# Privileged evaluation always uses protected default-branch code. Review and
# queue events arrive through workflow_run, never by executing PR code here.
# pull_request_target has no branch filter so stacked PRs refresh too; GitHub
# runs it from the default branch whatever the PR's base.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [review-policy-events, review-policy-tests]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Serialize PR status writers. Give each merge-group SHA its own lane so a
# burst of PR events cannot replace a pending queue evaluation. Never cancel
# a running writer halfway through its pending -> final transition.
concurrency:
  group: >-
    review-policy-${{ github.event.workflow_run.event == 'merge_group' &&
    github.event.workflow_run.head_sha || 'pull-requests' }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # No cache: a privileged job must not restore caches that PR runs can write.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/review-policy/go.mod
          cache: false
      - name: Evaluate review policy
        working-directory: .github/review-policy
        run: go run .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
