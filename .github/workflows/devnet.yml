name: devnet

on:
  # Release branches are tested before tagging; only tags publish.
  push:
    branches: ['v*']
    tags: ['v*']
  pull_request:
    paths:
      - 'docker/devnet/**'
      - 'local_devnet/submit/**'
      - '.github/workflows/devnet.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing app version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: devnet-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      DEVNET_VERSION: local
      DEVNET_LOG_DIR: /tmp/devnet-logs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: Resolve version
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ -n "$tag" ]]; then
            [[ "$tag" == v* && "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$tag^{commit}")" ]]
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check scripts and Dockerfile
        run: |
          shellcheck docker/devnet/*.sh
          docker run --rm -i hadolint/hadolint:v2.15.0 < docker/devnet/Dockerfile
          docker compose -f docker/devnet/compose.yaml -f docker/devnet/compose.build.yaml config --quiet
      - name: Build image
        run: docker compose -f docker/devnet/compose.yaml -f docker/devnet/compose.build.yaml build
      - name: Test devnet and persistence
        run: bash docker/devnet/smoke.sh
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devnet-logs-${{ matrix.arch }}
          path: ${{ env.DEVNET_LOG_DIR }}
          if-no-files-found: ignore
      - name: Save tested image
        if: steps.version.outputs.tag != '' && github.repository == 'celestiaorg/celestia-app'
        run: docker save ghcr.io/celestiaorg/celestia-devnet-validator:local | gzip > /tmp/devnet-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.tag != '' && github.repository == 'celestiaorg/celestia-app'
        with:
          name: devnet-images-${{ matrix.arch }}
          path: /tmp/devnet-images.tar.gz
          retention-days: 3

  publish:
    needs: build-test
    if: github.repository == 'celestiaorg/celestia-app' && needs.build-test.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/celestiaorg/celestia-devnet-validator
      TAG: ${{ needs.build-test.outputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: devnet-images-${{ matrix.arch }}
          path: /tmp
      - name: Push tested image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load < /tmp/devnet-images.tar.gz
          docker tag "$IMAGE:local" "$IMAGE:$TAG-$ARCH"
          docker push "$IMAGE:$TAG-$ARCH"

  manifests:
    needs: [build-test, publish]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/celestiaorg/celestia-devnet-validator
      TAG: ${{ needs.build-test.outputs.tag }}
    steps:
      - name: Publish and verify version manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
