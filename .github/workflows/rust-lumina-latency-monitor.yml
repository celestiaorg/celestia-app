name: rust-lumina-latency-monitor
on:
  pull_request:
    paths:
      - tools/lumina-latency-monitor/**
  push:
    branches:
      - "v*"
    tags:
      - "v*"

# Cancel superseded runs on the same PR. Pushes to branches get a unique group
# (run_id), so post-merge runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-lumina-latency-monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lumina-latency-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/lumina-latency-monitor -> tools/lumina-latency-monitor/target
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --release
