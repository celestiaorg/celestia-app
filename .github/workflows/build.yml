name: build
on:
  workflow_call:

jobs:
  build:
    name: build
    # Skip in the merge queue: test / build-e2e-artifacts already runs
    # `make build` on the combined result there, and the coverage suite compiles
    # every package.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: ./.github/actions/setup-go
      - name: build
        run: make build

  build-fibre:
    name: build-fibre
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: ./.github/actions/setup-go
      - name: build-fibre
        run: make build-fibre-server

  build-32bit:
    name: build-32bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: ./.github/actions/setup-go
      - name: build-32bit
        # Downstream projects compile celestia-app for 32-bit targets. See #4993.
        run: GOOS=linux GOARCH=mips CGO_ENABLED=0 go build ./...
