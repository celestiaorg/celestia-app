name: ci-release

# Run this workflow on push events to release branches, push events for new
# semantic version tags, and all PRs. The merge_group trigger handles main
# branch validation via the merge queue, so a separate push trigger for main
# is not needed and would cause duplicate CI runs.
on:
  push:
    branches:
      - "v*"
    tags:
      - "v*"
  release:
    types: [published]
  pull_request:
  merge_group:
  workflow_dispatch:

# Supersede in-flight runs for a pull request when it is pushed again. Stacked
# PRs are restacked as a unit, so a single rebase force-pushes every branch in
# the stack and would otherwise leave a full obsolete run per branch burning
# runners alongside the new one. Only pull_request runs are cancelled: a
# merge_group run gates the queue, and push/release runs record results against
# protected refs, so neither may be interrupted.
concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  markdown-linter:
    uses: ./.github/workflows/markdown-linter.yml

  goreleaser-image-check:
    uses: ./.github/workflows/goreleaser-image-check.yml

  build:
    uses: ./.github/workflows/build.yml

  test:
    uses: ./.github/workflows/test.yml

  goreleaser:
    if: github.event_name == 'release'
    uses: ./.github/workflows/goreleaser.yml
    permissions:
      contents: read
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
