name: review-policy-events

# This workflow has no write token. Its completion wakes the trusted evaluator.
# Its job name differs from review-policy-tests so a review event can never
# satisfy that required check without running the tests.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

jobs:
  notify:
    name: review-policy-notify
    runs-on: ubuntu-latest
    steps:
      - name: Notify trusted evaluator
        run: echo 'Review policy event received'
