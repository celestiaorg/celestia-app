name: arc-ci-test
on:
  push:
    branches: [arc-ci-test]
env:
  CGO_ENABLED: "1"
jobs:
  unit:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Machine
        run: nproc; free -g | head -2; df -h / | tail -1
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential make git curl
      - uses: ./.github/actions/setup-go
      - name: Unit tests
        run: |
          set -o pipefail
          time make test PACKAGES="$(go list ./... | grep -v 'app/test$' | grep -v 'test/txsim$' | grep -v 'pkg/user$' | grep -v 'test/ledger$' | grep -v 'celestia-app/v12/fibre' | grep -v 'tools/chainbuilder$' | tr '\n' ' ')"
  coverage:
    runs-on: arc-runners
    strategy:
      fail-fast: false
      matrix:
        shard: [app-test, fibre-tools, rest, txsim, user]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Machine
        run: nproc; free -g | head -2
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential make git curl
      - uses: ./.github/actions/setup-go
      - name: Coverage shard
        env:
          COVER_SHARD: ${{ matrix.shard }}
        run: time make test-coverage
