---
name: auto-assign

# Use the base branch's workflow for fork PRs. Never check out or run PR code.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign the PR author
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Fetch current assignees because the opening event may be stale.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (pr.assignees.some((assignee) => assignee.login === pr.user.login)) return;

            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: pr.number,
              assignees: [pr.user.login],
            });
