name: lint-pull-request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: conventional-commit-pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 #v6.1.1
        with:
          subjectPattern: '^\[(high|medium|low)\] \S.*$'
          subjectPatternError: |
            Start the subject with [high], [medium], or [low] to indicate the review thoroughness needed.
            Example: "fix: [high] correct gas accounting". See the README's Contributing section.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
