name: Post-merge CI

# Smoke-check the landed source. The merge queue already validates the combined
# result with the full suite; coverage on main separately publishes its baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - uses: ./.github/actions/setup-go
      - name: Build standalone binary
        run: make -o mod build-standalone
      - name: Check CLI and initialize a node
        run: |
          build/celestia-appd version
          build/celestia-appd init ci-smoke --chain-id ci-post-merge --home "$RUNNER_TEMP/ci-smoke"
          jq -e '.chain_id == "ci-post-merge"' "$RUNNER_TEMP/ci-smoke/config/genesis.json"
          test -s "$RUNNER_TEMP/ci-smoke/config/config.toml"
          test -s "$RUNNER_TEMP/ci-smoke/config/app.toml"

  notify-slack-on-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'failure' }}
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "CI failed on main: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
