name: review-policy-tests

# Runs the policy's Go tests with a read-only token. On merge_group, its
# completion also wakes the trusted evaluator to revalidate the queue.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: review-policy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/review-policy/go.mod
          cache: false
      - name: Test review policy
        working-directory: .github/review-policy
        run: go vet ./... && go test ./...
