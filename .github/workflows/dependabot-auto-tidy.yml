name: dependabot-auto-tidy

# test/docker-e2e is a separate Go module that pins the root module by relative
# path (github.com/celestiaorg/celestia-app/v10 => ../..), so its indirect
# requirements are a derived artifact of the root go.mod. A Dependabot bump to a
# root dependency can leave test/docker-e2e untidy and turn go-mod-tidy-check
# red, which a maintainer then has to fix by hand. Regenerate and push the result
# so those pull requests stay green on their own. See #7641.
on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "test/docker-e2e/go.mod"
      - "test/docker-e2e/go.sum"

permissions:
  contents: read

# Dependabot force-pushes when it rebases. Cancel an in-flight run rather than
# let it race, because its push at the end would be rejected anyway.
concurrency:
  group: dependabot-auto-tidy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-tidy:
    name: auto-tidy
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The `secrets` context is not available in `if:` conditions, so surface
      # whether the credentials exist through `env`, which is. Both are checked:
      # minting a token with one of the two missing fails the job instead of
      # skipping it.
      APP_ID: ${{ secrets.RELEASE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    steps:
      - name: Check that app credentials are configured
        id: creds
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must both be available as Dependabot secrets; skipping auto-tidy. See #7641."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App installation token
        id: app-token
        if: steps.creds.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        if: steps.creds.outputs.configured == 'true'
        with:
          # Check out the branch itself rather than the detached merge commit,
          # so the tidy commit can be pushed back to the pull request.
          ref: ${{ github.event.pull_request.head.ref }}
          # A push made with GITHUB_TOKEN does not retrigger workflows, so
          # go-mod-tidy-check would never re-run and the pull request would stay
          # red. Push with the app token instead.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        if: steps.creds.outputs.configured == 'true'
        with:
          go-version-file: "go.mod"

      - name: Tidy all modules
        if: steps.creds.outputs.configured == 'true'
        run: make mod

      # A no-op when everything is already tidy, so the rerun triggered by the
      # push below terminates instead of looping.
      - name: Commit and push any changes
        if: steps.creds.outputs.configured == 'true'
        run: ./scripts/commit-tidy-changes.sh
